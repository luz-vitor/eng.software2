version: '3.3'

services:
  db:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: aluno
      MYSQL_DATABASE: mysql
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mysql_data:
